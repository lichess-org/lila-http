[package]
name = "lila-http"
publish = false
description = "handle some of the load of lichess.org/tournament"
homepage = "https://lichess.org/tournament"
repository = "https://github.com/lichess-org/lila-http"
readme = "README.md"
license = "AGPL-3.0+"
categories = ["games"]
keywords = ["chess", "lichess"]
edition = "2021"

[dependencies]
env_logger = "0.11"
itertools = "0.15"
listenfd = "1"
log = "0.4"
serde_json = "1"
serde_with = "3"
thiserror = "2"

[dependencies.arrayvec]
version = "0.7"
features = ["serde"]

[dependencies.axum]
version = "0.8"
default-features = false
features = ["http1", "query", "tokio"]

[dependencies.axum-extra]
version = "0.12"
default-features = false
features = ["erased-json"]

[dependencies.clap]
version = "4"
default-features = false
features = ["derive", "env", "help", "std", "usage"]

[dependencies.futures]
version = "0.3"
default-features = false
features = ["std"]

[dependencies.moka]
version = "0.12"
features = ["future"]

[dependencies.redis]
version = "1.8"
default-features = false
features = ["aio", "tokio-comp"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tikv-jemallocator]
version = "0.7"
features = ["unprefixed_malloc_on_supported_platforms"]

[dependencies.tokio]
version = "1"
features = ["macros", "net", "rt-multi-thread", "time"]

[dependencies.tower-http]
version = "0.7"
features = ["set-header"]

[profile.release]
lto = true
